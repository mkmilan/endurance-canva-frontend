name: Verify studio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: studio-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  studio:
    name: Build and browser verification
    # MongoDB 8.0 currently rejects newer 6.19+ host kernels (SERVER-121912).
    # Use the supported 22.04 runner instead of disabling MongoDB's guard.
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      BACKEND_API_URL: http://127.0.0.1:4000
      CANVAS_TEST_URL: http://127.0.0.1:3000
      STUDIO_ORIGIN: http://127.0.0.1:3000
      TEST_MONGODB_URI: mongodb://127.0.0.1:27017/?replicaSet=canvas-test
      BACKEND_REF: 259760be5e75e4690765d679085933de181561ba
    steps:
      - name: Set runtime paths
        run: |
          {
            printf 'CANVAS_QA_ARTIFACT_DIR=%s/endurance-canvas-qa\n' "$RUNNER_TEMP"
            printf 'BACKEND_QA_DIR=%s/endurance-canvas-backend\n' "$RUNNER_TEMP"
            printf 'PLAYWRIGHT_TOOLS_DIR=%s/endurance-canvas-playwright\n' "$RUNNER_TEMP"
            printf 'NODE_PATH=%s/endurance-canvas-playwright/node_modules\n' "$RUNNER_TEMP"
          } >> "$GITHUB_ENV"
          node - <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const token = crypto.randomBytes(32).toString('hex');
          process.stdout.write(`::add-mask::${token}\n`);
          fs.appendFileSync(process.env.GITHUB_ENV, `CANVAS_TEST_SETUP_TOKEN=${token}\n`);
          NODE

      - name: Check out the tested frontend revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24.22.1'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Prepare verification artifacts
        run: |
          mkdir -p "$CANVAS_QA_ARTIFACT_DIR"
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          fs.writeFileSync(path.join(process.env.CANVAS_QA_ARTIFACT_DIR, 'report.json'), JSON.stringify({
            status: 'not-run', passed: false, frontendCommit: process.env.GITHUB_SHA,
            backendCommit: process.env.BACKEND_REF,
            message: 'Browser verification has not started. Inspect the job logs if an earlier step failed.'
          }, null, 2));
          NODE

      - name: Install, test, and build the frontend
        run: |
          npm ci --no-audit --no-fund
          npm test 2>&1 | tee "$CANVAS_QA_ARTIFACT_DIR/frontend-tests.log"
          npm run build 2>&1 | tee "$CANVAS_QA_ARTIFACT_DIR/frontend-build.log"

      - name: Check out the published backend revision
        run: |
          git clone --quiet https://github.com/mkmilan/endurance-canva-backend.git "$BACKEND_QA_DIR"
          git -C "$BACKEND_QA_DIR" checkout --detach "$BACKEND_REF"
          test "$(git -C "$BACKEND_QA_DIR" rev-parse HEAD)" = "$BACKEND_REF"

      - name: Install backend dependencies
        run: |
          cd "$BACKEND_QA_DIR"
          npm ci --no-audit --no-fund

      - name: Start an isolated MongoDB replica set for auth and quota tests
        run: |
          docker run --detach --name canvas-test-mongo --publish 127.0.0.1:27017:27017 mongo:8.0.34 --replSet canvas-test --bind_ip_all
          for attempt in {1..30}; do
            if docker exec canvas-test-mongo mongosh --quiet --eval 'db.adminCommand({ping:1}).ok' >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          docker exec canvas-test-mongo mongosh --quiet --eval 'rs.initiate({_id:"canvas-test",members:[{_id:0,host:"127.0.0.1:27017"}]})'
          for attempt in {1..30}; do
            if docker exec canvas-test-mongo mongosh --quiet --eval 'if (!db.hello().isWritablePrimary) quit(1)' >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          docker logs canvas-test-mongo
          exit 1

      - name: Verify the backend with real database transactions
        run: |
          cd "$BACKEND_QA_DIR"
          npm test 2>&1 | tee "$CANVAS_QA_ARTIFACT_DIR/backend-tests.log"

      - name: Install the pinned browser tooling outside the repository
        run: |
          npm install --prefix "$PLAYWRIGHT_TOOLS_DIR" --no-save --ignore-scripts --no-audit --no-fund playwright@1.62.1
          "$PLAYWRIGHT_TOOLS_DIR/node_modules/.bin/playwright" install --with-deps chromium

      - name: Start the studio with real auth and a labelled AI test fixture
        run: |
          NODE_ENV=development HOST=127.0.0.1 PORT=4000 node "$BACKEND_QA_DIR/test/browser-server.js" > "$CANVAS_QA_ARTIFACT_DIR/backend.log" 2>&1 &
          echo "$!" > "$CANVAS_QA_ARTIFACT_DIR/backend.pid"
          NODE_ENV=production PORT=3000 npm start > "$CANVAS_QA_ARTIFACT_DIR/frontend.log" 2>&1 &
          echo "$!" > "$CANVAS_QA_ARTIFACT_DIR/frontend.pid"
          node - <<'NODE'
          const { setTimeout: pause } = require('node:timers/promises');
          async function ready(url, expected) {
            const deadline = Date.now() + 60000;
            let last = 'No response';
            while (Date.now() < deadline) {
              try {
                const response = await fetch(url, { signal: AbortSignal.timeout(3000) });
                const body = await response.json();
                if (response.ok && expected(body)) return;
                last = `HTTP ${response.status}: ${JSON.stringify(body)}`;
              } catch (error) { last = error.message; }
              await pause(500);
            }
            throw new Error(`${url} was not ready: ${last}`);
          }
          Promise.all([
            ready(`${process.env.BACKEND_API_URL}/health`, value => value.status === 'ok'),
            ready(`${process.env.CANVAS_TEST_URL}/api/creator`, value => value.status === 'ok' && value.auth?.configured && value.auth?.setupAvailable)
          ]).catch(error => { console.error(error); process.exitCode = 1; });
          NODE

      - name: Exercise the studio in bundled Chromium
        timeout-minutes: 5
        run: node tests/studio.e2e.cjs

      - name: Stop test services
        if: always()
        run: |
          for service in frontend backend; do
            if [ -f "$CANVAS_QA_ARTIFACT_DIR/$service.pid" ]; then
              kill "$(cat "$CANVAS_QA_ARTIFACT_DIR/$service.pid")" 2>/dev/null || true
            fi
          done
          docker logs canvas-test-mongo > "$CANVAS_QA_ARTIFACT_DIR/mongodb.log" 2>&1 || true
          docker rm --force canvas-test-mongo >/dev/null 2>&1 || true

      - name: Upload browser evidence and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: studio-verification-${{ github.sha }}
          path: ${{ env.CANVAS_QA_ARTIFACT_DIR }}/
          if-no-files-found: warn
          retention-days: 14
